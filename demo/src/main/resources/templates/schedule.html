<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Расписание | EduJournal</title>
</head>
<body>
    <div th:fragment="content">
        <div class="header-actions" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Расписание занятий</h1>
            <button sec:authorize="hasRole('DIRECTOR')" class="btn" style="width: auto;" onclick="document.getElementById('sched-modal').style.display='block'">Добавить урок</button>
        </div>

        <div th:if="${param.success}" style="background: var(--success); color: white; padding: 1rem; border-radius: var(--radius); margin-bottom: 1.5rem;">
            Расписание сохранено.
        </div>
        <div th:if="${param.error}" style="background: var(--error); color: white; padding: 1rem; border-radius: var(--radius); margin-bottom: 1.5rem;">
            Не удалось сохранить урок: проверьте предмет учителя и свободен ли учитель в это время.
        </div>

        <div class="schedule-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
            <div th:each="day : ${#strings.arraySplit('MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY', ',')}" class="day-column" style="background: var(--surface); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border);">
                <h3 th:text="${day}" style="border-bottom: 2px solid var(--primary); padding-bottom: 0.5rem; margin-bottom: 1rem; color: var(--primary);">MONDAY</h3>

                <div class="lessons-list" style="display: flex; flex-direction: column; gap: 1rem;">
                    <div th:each="item : ${schedule}" th:if="${item.dayOfWeek == day}" class="lesson-card" style="background: var(--background); padding: 1rem; border-radius: 4px; border-left: 3px solid var(--primary);">
                        <div style="display: flex; justify-content: space-between; gap: 1rem;">
                            <strong th:text="${item.subjectName}">Математика</strong>
                            <span th:text="${item.room}" style="font-size: 0.8rem; color: var(--text-muted);">305</span>
                        </div>
                        <div style="margin-top: 0.5rem; font-size: 0.9rem;">
                            <span th:text="${item.startTime}">08:30</span> - <span th:text="${item.endTime}">09:15</span>
                        </div>
                        <div style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-muted);" th:text="${item.className + ' | ' + item.teacherName}">8A | Teacher</div>

                        <details sec:authorize="hasRole('DIRECTOR')" style="margin-top: 1rem;">
                            <summary style="cursor: pointer; color: var(--primary); font-weight: 600;">Редактировать</summary>
                            <form th:action="@{/schedule/{id}/edit(id=${item.id})}" method="post" style="margin-top: 1rem; display: grid; gap: 0.75rem;">
                                <select name="classId" required style="width: 100%; padding: 0.65rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                                    <option th:each="cl : ${classes}" th:value="${cl.id}" th:selected="${cl.id == item.classId}" th:text="${cl.name}">8A</option>
                                </select>
                                <select name="teacherId" required style="width: 100%; padding: 0.65rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                                    <option th:each="teacher : ${teachers}" th:value="${teacher.id}" th:selected="${teacher.id == item.teacherId}" th:text="${teacher.fullName + (teacher.teacherSubject != null ? ' - ' + teacher.teacherSubject.name : ' - предмет не назначен')}">Teacher</option>
                                </select>
                                <select name="subjectId" required style="width: 100%; padding: 0.65rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                                    <option th:each="sub : ${subjects}" th:value="${sub.id}" th:selected="${sub.id == item.subjectId}" th:text="${sub.name}">Subject</option>
                                </select>
                                <select name="dayOfWeek" required style="width: 100%; padding: 0.65rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                                    <option value="MONDAY" th:selected="${item.dayOfWeek == 'MONDAY'}">Понедельник</option>
                                    <option value="TUESDAY" th:selected="${item.dayOfWeek == 'TUESDAY'}">Вторник</option>
                                    <option value="WEDNESDAY" th:selected="${item.dayOfWeek == 'WEDNESDAY'}">Среда</option>
                                    <option value="THURSDAY" th:selected="${item.dayOfWeek == 'THURSDAY'}">Четверг</option>
                                    <option value="FRIDAY" th:selected="${item.dayOfWeek == 'FRIDAY'}">Пятница</option>
                                    <option value="SATURDAY" th:selected="${item.dayOfWeek == 'SATURDAY'}">Суббота</option>
                                </select>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                                    <input type="time" name="startTime" th:value="${item.startTime}" required style="width: 100%; padding: 0.65rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                                    <input type="time" name="endTime" th:value="${item.endTime}" required style="width: 100%; padding: 0.65rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                                </div>
                                <input type="text" name="classroom" th:value="${item.room}" required style="width: 100%; padding: 0.65rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                                <button type="submit" class="btn">Сохранить</button>
                            </form>
                            <form th:action="@{/schedule/{id}/delete(id=${item.id})}" method="post" style="margin-top: 0.75rem;">
                                <button type="submit" class="btn" style="background: var(--error);">Удалить</button>
                            </form>
                        </details>
                    </div>
                </div>
            </div>
        </div>

        <div id="sched-modal" class="modal" style="display:none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); overflow-y: auto; padding: 1rem;">
            <div class="auth-container" style="margin: 1rem auto; background: var(--surface); padding: 2rem; border: 1px solid var(--border); border-radius: var(--radius); max-width: 500px;">
                <span onclick="document.getElementById('sched-modal').style.display='none'" style="float: right; cursor: pointer; font-size: 1.5rem;">&times;</span>
                <h2>Добавить урок</h2>
                <form th:action="@{/schedule/add}" method="post" style="margin-top: 1.5rem;">
                    <div class="form-group">
                        <label>Класс</label>
                        <select name="classId" required style="width: 100%; padding: 0.75rem; background: var(--background); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                            <option th:each="cl : ${classes}" th:value="${cl.id}" th:text="${cl.name}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Учитель</label>
                        <select name="teacherId" required style="width: 100%; padding: 0.75rem; background: var(--background); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                            <option th:each="teacher : ${teachers}" th:value="${teacher.id}" th:text="${teacher.fullName + (teacher.teacherSubject != null ? ' - ' + teacher.teacherSubject.name : ' - предмет не назначен')}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Предмет</label>
                        <select name="subjectId" required style="width: 100%; padding: 0.75rem; background: var(--background); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                            <option th:each="sub : ${subjects}" th:value="${sub.id}" th:text="${sub.name}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>День недели</label>
                        <select name="dayOfWeek" required style="width: 100%; padding: 0.75rem; background: var(--background); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                            <option value="MONDAY">Понедельник</option>
                            <option value="TUESDAY">Вторник</option>
                            <option value="WEDNESDAY">Среда</option>
                            <option value="THURSDAY">Четверг</option>
                            <option value="FRIDAY">Пятница</option>
                            <option value="SATURDAY">Суббота</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <div class="form-group" style="flex: 1;">
                            <label>Начало</label>
                            <input type="time" name="startTime" required style="width: 100%; padding: 0.75rem; background: var(--background); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Конец</label>
                            <input type="time" name="endTime" required style="width: 100%; padding: 0.75rem; background: var(--background); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Кабинет</label>
                        <input type="text" name="classroom" placeholder="Напр: 305" required style="width: 100%; padding: 0.75rem; background: var(--background); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);">
                    </div>
                    <button type="submit" class="btn">Сохранить</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
