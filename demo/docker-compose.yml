version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: edujournal-db
    environment:
      POSTGRES_DB: edujournal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5555
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: edujournal-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/edujournal
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 5555
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
